name = "tape-voice"
main = "worker.js"
compatibility_date = "2025-09-01"
workers_dev = true

[vars]
PER_IP_DAY = "40"    # recordings per person per day
TOTAL_DAY = "400"    # recordings for everyone together per day

[[durable_objects.bindings]]
name = "LIMITER"
class_name = "Limiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Limiter"]
