name = "tape-voice"
main = "worker.js"
compatibility_date = "2025-09-01"
workers_dev = true

[vars]
PER_IP_CENTS = "50"   # spend per person (internet address) per day, in US cents
TOTAL_CENTS = "500"   # spend for everyone together per day, in US cents

[[durable_objects.bindings]]
name = "LIMITER"
class_name = "Limiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Limiter"]
