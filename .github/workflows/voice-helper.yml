name: Deploy shared mic helper
on:
  push:
    branches: [main]
    paths: ['voice-helper/**', '.github/workflows/voice-helper.yml']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the secrets are there
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFARE_API_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          miss=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || miss="$miss CLOUDFLARE_API_TOKEN"
          [ -n "$OPENAI_API_KEY" ] || miss="$miss OPENAI_API_KEY"
          if [ -n "$miss" ]; then echo "::error::Missing GitHub secrets:$miss"; exit 1; fi
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFARE_API_TOKEN }}
          workingDirectory: voice-helper
          secrets: |
            OPENAI_API_KEY
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - name: Check the helper answers
        run: |
          sleep 5
          U=https://tape-voice.oneklover4.workers.dev
          curl -sS "$U/" | tee /tmp/h; echo
          grep -q '"ready":true' /tmp/h || { echo "::error::Helper is not ready (no OpenAI key?)"; exit 1; }
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST -H 'Origin: https://example.com' -F file=@voice-helper/wrangler.toml "$U/transcribe")
          echo "other website -> $code"; [ "$code" = 403 ] || { echo "::error::Another website was not refused"; exit 1; }
          code=$(curl -sS -o /tmp/b -w '%{http_code}' -X POST -H 'Origin: https://oneklover4-boop.github.io' "$U/transcribe")
          echo "site, no recording -> $code $(cat /tmp/b)"; [ "$code" = 400 ] || { echo "::error::Unexpected answer"; exit 1; }
          curl -sS -o /dev/null -D - -X OPTIONS -H 'Origin: https://oneklover4-boop.github.io' "$U/transcribe" | grep -i '^access-control-allow-origin'
          # backtest notes summary: a real sample, the answer must pick out the bias
          curl -sS -X POST -H 'Origin: https://oneklover4-boop.github.io' -H 'Content-Type: application/json' -d '{"said":"Okay so I have a bullish bias today because we are above the daily open. Price manipulated into the 4H FVG and swept the London low. My confirmation was SMT with ES and then a CISD on the 1 minute. My stop loss is under the swing low and TP is the Asia high. My DOL is the buy side liquidity above the Asia high."}' "$U/notes" | tee /tmp/n; echo
          grep -q '"bias":"Bullish"' /tmp/n || { echo "::error::The notes summary did not answer properly"; exit 1; }
          # journal template fill (2026-11-22 layout): long rambling talk-through, then psychology, improve and a grade at the end
          cat > /tmp/r1.json <<'J'
          {"mode":"tpl","said":"Okay so um, for the day, like, what I want is either we sweep the Asia low first and then we run up to the previous day high, or we take the previous day high first and then come back down. So London kind of chopped around, nothing really happened, um, and then going into New York we came down and we swept the Asia low, which is what I wanted, and we traded into this 15 minute fair value gap. And I was like, if we see displacement out of this, then I'm in. And we did, we got nice displacement out, and then on the one minute we had an IFEG, so like the one minute inverse FVG, that was my confirmation. ES also made a lower low and NQ didn't so we had SMT. I put my TP at the previous day high because that's where the buy side is and my stop under the low of the 15 minute FVG. PO3 yes. True manip yes. H R L R no. Psychology wise, I was calm, I waited for my setup and didn't rush it. What I can improve is I should have held for the full target instead of taking partials early. I'd rate this trade an A minus."}
          J
          curl -sS -X POST -H 'Origin: https://oneklover4-boop.github.io' -H 'Content-Type: application/json' --data @/tmp/r1.json "$U/notes" | tee /tmp/w1; echo
          cat > /tmp/r2.json <<'J'
          {"mode":"tpl","said":"Right so today I'm thinking bearish, we're in premium on the daily. New York opened, we pushed up, took London high, and then traded into the 1 hour order block. Then the 3 minute I F V G formed and I sold off that, target the PDL, stop above the high. Um honestly I was a bit anxious going in because of the last loss. I need to stop revenge trading. B plus."}
          J
          curl -sS -X POST -H 'Origin: https://oneklover4-boop.github.io' -H 'Content-Type: application/json' --data @/tmp/r2.json "$U/notes" | tee /tmp/w2; echo
          python3 - <<'PY'
          import json, sys
          bad = []
          def low(n, k): return (n.get(k) or '').lower()
          n = json.load(open('/tmp/w1'))['notes']; print('--- 1'); [print(f'{k}: {v}') for k, v in n.items()]
          if n['confirmation'] != '1m iFVG': bad.append('1 confirmation')
          w = low(n, 'why')
          if not all(x in w for x in ('asia low', '15m fvg', 'displacement')) or len(w.split()) < 40: bad.append('1 why not kept in full')
          if ' um' in w or 'you know' in w: bad.append('1 why has filler')
          if 'calm' not in low(n, 'psych') or 'calm' in w: bad.append('1 psych')
          if 'target' not in low(n, 'improve') and 'partial' not in low(n, 'improve'): bad.append('1 improve')
          if n['confidence'] != 'A-': bad.append('1 confidence')
          if n['po3'] != 'Yes' or n['true_manip'] != 'Yes' or n['hr_lr'] != 'No' or n['smt'] != 'Yes' or n['a_plus_dol'] or n['amd'] or n['pd_array'] or n['ltf_lrl']: bad.append('1 checklist')
          n = json.load(open('/tmp/w2'))['notes']; print('--- 2'); [print(f'{k}: {v}') for k, v in n.items()]
          if n['confirmation'] != '3m iFVG': bad.append('2 confirmation')
          if 'order block' not in low(n, 'why') and '1h ob' not in low(n, 'why'): bad.append('2 why')
          if 'anxious' not in low(n, 'psych'): bad.append('2 psych')
          if 'revenge' not in low(n, 'improve'): bad.append('2 improve')
          if n['confidence'] != 'B+': bad.append('2 confidence')
          if any(n[k] for k in ('a_plus_dol', 'po3', 'amd', 'true_manip', 'pd_array', 'ltf_lrl', 'hr_lr', 'smt', 'cisd')): bad.append('2 guessed a yes/no')
          if bad: print('::error::Journal fill wrong: ' + ', '.join(bad)); sys.exit(1)
          PY
